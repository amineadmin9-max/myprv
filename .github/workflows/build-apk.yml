name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Copy web files to Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp docs/index.html android/app/src/main/assets/
          cp docs/expand.js android/app/src/main/assets/
          cp docs/count.js android/app/src/main/assets/
          cp docs/sw.js android/app/src/main/assets/ 2>/dev/null || true
          cp docs/manifest.json android/app/src/main/assets/ 2>/dev/null || true

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
        working-directory: android

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: niche-finder-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Release APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.0-${{ github.run_number }}
          name: Niche Finder APK v${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          body: |
            Niche Finder Android APK
            - Bundled web app (no server needed)
            - YouTube Suggest expansion (incremental deepening)
            - YouTube Data API v3 direct calls
            - Dual scoring (Evergreen + Trending)
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
