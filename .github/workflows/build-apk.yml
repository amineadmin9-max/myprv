name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Copy web files to Android assets
        run: |
          cp docs/index.html android/app/src/main/assets/
          cp docs/sw.js android/app/src/main/assets/ 2>/dev/null || true
          cp docs/manifest.json android/app/src/main/assets/ 2>/dev/null || true

      - name: Build Debug APK
        run: cd android && gradle assembleDebug

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: niche-finder-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Release APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Niche Finder APK v4.0
          files: android/app/build/outputs/apk/debug/app-debug.apk
          body: |
            Niche Finder Android APK
            - Bundled web app (no server needed)
            - Uses phone's IP directly for Google Trends
            - YouTube Data API + AI analysis
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
