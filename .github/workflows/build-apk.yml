name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Copy web files to Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp docs/index.html android/app/src/main/assets/
          cp docs/sw.js android/app/src/main/assets/ 2>/dev/null || true
          cp docs/manifest.json android/app/src/main/assets/ 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          ls -la gradlew
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 || true
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "No APK output found"
        working-directory: android

      - name: Upload APK as artifact
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: niche-finder-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 30
