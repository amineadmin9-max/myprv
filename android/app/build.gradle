apply plugin: 'com.android.application'

android {
    namespace 'com.nichefinder.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.nichefinder.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "4.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
}
